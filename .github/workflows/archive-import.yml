name: Refresh historical season archive

on:
  workflow_dispatch:
    inputs:
      team:
        description: Team key (cubs, whitesox, bears, bulls, blackhawks)
        required: true
        type: string
      season:
        description: Ending year, such as 1996
        required: true
        type: string
  schedule:
    - cron: '15 9 1 * *'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Import requested season
        if: github.event_name == 'workflow_dispatch'
        run: npm run archive:import -- --team "${{ inputs.team }}" --season "${{ inputs.season }}"
      - name: Refresh each latest completed season
        if: github.event_name == 'schedule'
        run: npm run archive:import -- --all --latest-completed
      - run: npm run archive:validate
      - run: npm test
      - name: Commit updated season files
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "chicagosports-archive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/archive
          git commit -m "Refresh historical season archive"
          git push
